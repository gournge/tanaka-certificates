[project]
name = "tanaka-certificates"
version = "0.1.0"
description = "Numerical experiments for one-dimensional Tanaka certificates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tanaka_certificates"]

[tool.pytest.ini_options]
testpaths = ["tests"]
